name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Скачивание файлов репозитория
        uses: actions/checkout@v4

      - name: Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек (pygame, vpython, pyinstaller)
        run: |
          python -m pip install --upgrade pip
          pip install pygame vpython pyinstaller

      - name: Сборка автономного EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all vpython --name "MiniGamesLauncher" launcher_autonomous.pyw

      - name: Выгрузка готового EXE для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: MiniGamesLauncher-Windows
          path: dist/MiniGamesLauncher.exe
